<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>

    <!-- START HEADER -->
    <header class="header" id="header">
        <div class="header-part">
            <h1>Projects</h1>
            <span class="material-symbols-outlined theme">
                dark_mode
            </span>
        </div>
        <div class="header-part">
            <button class="add-btn" id="open-add-panel">+ Add Project</button>
            <button class="add-btn">Seed data</button>
        </div>
    </header>
    <!-- END HEADER -->

    <div class="container"> <!-- SIDEBAR START -->
        <div class="sidebar" id="sidebar">
            <div class="period-selectors">
                <div class="selector-group">
                    <div class="period-label">Month</div>
                    <select class="custom-select" id="month-select">
                        <option value="0">January</option>
                        <option value="1">February</option>
                        <option value="2">March</option>
                        <option value="3">April</option>
                        <option value="4">May</option>
                        <option value="5">June</option>
                        <option value="6">July</option>
                        <option value="7">August</option>
                        <option value="8">September</option>
                        <option value="9">October</option>
                        <option value="10">November</option>
                        <option value="11">December</option>
                    </select>
                </div>
                <div class="selector-group">
                    <div class="period-label">Year</div>
                    <select class="custom-select" id="year-select">
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-btn active" data-tab="projects">Projects</button>
                <button class="nav-btn" data-tab="employees">Employees</button>
            </nav>
        </div>
        <main class="main" id="main">
            <div id="projects-view" class="view">
                <table class="data-table" id="projects-table">
                    <thead>
                        <tr>
                            <th>Company</th>
                            <th>Project</th>
                            <th>Budget</th>
                            <th>Capacity</th>
                        </tr>
                    </thead>
                    <tbody id="projects-tbody">
                    </tbody>
                </table>
            </div>

            <div id="employees-view" class="view" style="display: none;">
                <table class="data-table" id="employees-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Surname</th>
                            <th>Age</th>
                            <th>Position</th>
                            <th>Salary</th>
                        </tr>
                    </thead>
                    <tbody id="employees-tbody">
                    </tbody>
                </table>
            </div>
        </main>
        <div class="panel-overlay" id="panel-overlay"></div>

        <div class="slide-panel" id="add-project-panel">
            <div class="panel-header">
                <h2>Add Project</h2>
                <button class="panel-close" id="close-project-panel">✕</button>
            </div>
            <div class="panel-body">
                <div class="form-group">
                    <label class="form-label">Project Name</label>
                    <input type="text" class="form-input" id="input-project-name">
                    <span class="form-error" id="error-project-name"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Company Name</label>
                    <input type="text" class="form-input" id="input-company-name">
                    <span class="form-error" id="error-company-name"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Budget</label>
                    <input type="number" class="form-input" id="input-budget">
                    <span class="form-error" id="error-budget"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Employee Capacity</label>
                    <input type="number" class="form-input" id="input-capacity">
                    <span class="form-error" id="error-capacity"></span>
                </div>
                <button class="submit-btn" id="submit-project">Add Project</button>
            </div>
        </div>
        <div class="slide-panel" id="add-employee-panel">
            <div class="panel-header">
                <h2>Add Employee</h2>
                <button class="panel-close" id="close-employee-panel">✕</button>
            </div>
            <div class="panel-body">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-input" id="input-emp-name">
                    <span class="form-error" id="error-emp-name"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Surname</label>
                    <input type="text" class="form-input" id="input-emp-surname">
                    <span class="form-error" id="error-emp-surname"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-input" id="input-emp-dob">
                    <span class="form-error" id="error-emp-dob"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Position</label>
                    <select class="form-input custom-select" id="input-emp-position">
                        <option value="">Select position</option>
                        <option value="Junior">Junior</option>
                        <option value="Middle">Middle</option>
                        <option value="Senior">Senior</option>
                        <option value="Lead">Lead</option>
                        <option value="Architect">Architect</option>
                        <option value="BO">BO</option>
                    </select>
                    <span class="form-error" id="error-emp-position"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Salary</label>
                    <input type="number" class="form-input" id="input-emp-salary">
                    <span class="form-error" id="error-emp-salary"></span>
                </div>
                <button class="submit-btn" id="submit-employee" disabled>Add Employee</button>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
